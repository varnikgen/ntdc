# ntdc слушает 8000 внутри сети. Наружу — nginx.
# На Windows/Podman Desktop порты 80/443 часто НЕ попадают на localhost
# (живут в WSL-ВМ) → ERR_CONNECTION_REFUSED на ntdc-dev.bsmuk.ru.
# Поэтому дублируем 8080/8443 и публикуем uvicorn :8000 для проверки.

version: "3.8"

services:
  ntdc:
    build:
      context: .
      network: host
    container_name: ntdc-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:Z
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - ntdc-network

  nginx:
    image: nginx:alpine
    container_name: ntdc-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./nginx/ssl:/etc/nginx/ssl:ro,Z
    depends_on:
      - ntdc
    restart: unless-stopped
    networks:
      - ntdc-network

networks:
  ntdc-network:
    driver: bridge
