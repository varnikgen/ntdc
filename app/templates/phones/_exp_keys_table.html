{# Expansion module keys. Пагинация на клиенте (EXP_PAGE_SIZE). #}
<style>
#expKeysTable .exp-module,
#expKeysTable .exp-key {
  min-width: 3.25rem;
  width: 100%;
  padding-left: 0.35rem;
  padding-right: 0.25rem;
  text-align: center;
}
#expKeysTable .exp-value { min-width: 4rem; max-width: 10rem; }
#expKeysTable .exp-extension { min-width: 3.5rem; max-width: 8rem; }
#expKeysTable .exp-label { min-width: 5rem; }
#expKeysTable input[type=number]::-webkit-outer-spin-button,
#expKeysTable input[type=number]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
#expKeysTable input[type=number] { -moz-appearance: textfield; appearance: textfield; }
</style>
<div id="expKeysWrap" data-page-size="15">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
        <div class="small text-muted">
            Ключи: <span id="expKeysTotal">0</span>
            · стр. <span id="expKeysPageNum">1</span> / <span id="expKeysPageCount">1</span>
        </div>
        <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-secondary" onclick="expKeysPrevPage()" id="expKeysPrevBtn">
                <i class="bi bi-chevron-left"></i>
            </button>
            <button type="button" class="btn btn-outline-secondary" onclick="expKeysNextPage()" id="expKeysNextBtn">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-sm table-bordered" id="expKeysTable">
            <thead class="table-light">
                <tr>
                    <th style="width: 4.5rem;">Module</th>
                    <th style="width: 4.5rem;">Key</th>
                    <th style="width: 8rem;">Type</th>
                    <th style="width: 7.5rem;">Account</th>
                    <th style="width: 16%;">Value</th>
                    <th style="width: 12%;">Extension</th>
                    <th>Label</th>
                    <th style="width: 2.75rem;"></th>
                </tr>
            </thead>
            <tbody>
                {% for key in current_exp %}
                <tr data-index="{{ loop.index0 }}">
                    <td><input type="number" class="form-control form-control-sm exp-module" value="{{ key.module | default(1) }}" min="1" max="6"></td>
                    <td><input type="number" class="form-control form-control-sm exp-key" value="{{ key.key }}" min="1" max="60"></td>
                    <td>
                        <select class="form-select form-select-sm exp-type" onchange="updateExpAccountColumn(this)">
                            <option value="0" {% if key.type == 0 %}selected{% endif %}>N/A</option>
                            <option value="15" {% if key.type == 15 %}selected{% endif %}>Account</option>
                            <option value="13" {% if key.type == 13 %}selected{% endif %}>Speed Dial</option>
                            <option value="16" {% if key.type == 16 %}selected{% endif %}>BLF</option>
                        </select>
                    </td>
                    <td>
                        <select class="form-select form-select-sm exp-account" data-value="{{ key.account | default(1) }}">
                        </select>
                    </td>
                    <td><input type="text" class="form-control form-control-sm exp-value" value="{{ key.value or '' }}"></td>
                    <td><input type="text" class="form-control form-control-sm exp-extension" value="{{ key.extension or '' }}"></td>
                    <td><input type="text" class="form-control form-control-sm exp-label" value="{{ key.label or '' }}"></td>
                    <td><button type="button" class="btn btn-outline-danger btn-sm" onclick="removeExpKeyRow(this)"><i class="bi bi-trash"></i></button></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="d-flex flex-wrap gap-2 mt-2">
        <button type="button" class="btn btn-outline-primary btn-sm" onclick="addExpKey()">
            <i class="bi bi-plus"></i> Add Exp Key
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addExpKeyRange()">
            <i class="bi bi-plus-square"></i> Add 10 keys
        </button>
    </div>
</div>
<input type="hidden" name="custom_exp_keys" id="expKeysJson" value='{{ current_exp | tojson }}'>
<script>
(function initExpKeysUi() {
    const table = document.getElementById('expKeysTable');
    if (!table) return;
    table.querySelectorAll('tbody tr').forEach(row => {
        const typeSelect = row.querySelector('.exp-type');
        if (typeSelect) updateExpAccountColumn(typeSelect);
    });
    if (typeof expKeysShowPage === 'function') expKeysShowPage(0);
})();
</script>
