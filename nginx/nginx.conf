# HTTP на :80 — админка по IP (http://10.30.x.x/) без hosts и без сертификата.
# HTTPS на :443 — то, что прописано телефонам в PUBLIC_BASE_URL.
# Редирект 80→443 специально НЕ делаем: иначе браузер идёт на
# https://ntdc-dev.bsmuk.ru, сертификат не сходится с IP, и без
# «127.0.0.1 ntdc-dev.bsmuk.ru» в hosts UI «не открывается».

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location / {
        proxy_pass http://ntdc:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/ntdc.crt;
    ssl_certificate_key /etc/nginx/ssl/ntdc.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag noindex always;

    client_max_body_size 100m;

    location / {
        proxy_pass http://ntdc:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
